<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#050816;
  color:white;
  min-height:100vh;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,#061426,#02050d);
}

header{
  padding:22px 18px;
  text-align:center;
  border-bottom:1px solid #18304d;
}

header h1{
  color:#00bfff;
  font-size:34px;
}

header p{
  color:#9bb5cc;
  margin-top:6px;
}

#chat{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message{
  padding:13px 16px;
  margin:10px 0;
  border-radius:16px;
  max-width:85%;
  line-height:1.5;
}

.nova{
  background:#10243a;
  border:1px solid #17476d;
  margin-right:auto;
}

.user{
  background:#006d9c;
  margin-left:auto;
}

.inputArea{
  display:flex;
  gap:8px;
  padding:15px;
  border-top:1px solid #18304d;
  background:#050b16;
}

input{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:1px solid #24506e;
  background:#0b1725;
  color:white;
  outline:none;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:12px;
  background:#00aeea;
  color:white;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>🤖 NOVA AI</h1>
  <p>Your personal AI assistant</p>
</header>

<div id="chat">

  <div class="message nova">
    Hello! 👋 Main NOVA hoon.<br>
    Tum mujhse kuch bhi pooch sakti ho.
  </div>

</div>

<div class="inputArea">
  <input id="input" type="text" placeholder="Message NOVA..." onkeydown="enterKey(event)">
  <button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text,type){

  const message = document.createElement("div");

  message.className = "message " + type;

  message.innerText = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value = "";

  setTimeout(function(){

    const reply = novaReply(text);

    addMessage(reply,"nova");

  },500);
}

function enterKey(event){

  if(event.key === "Enter"){
    sendMessage();
  }

}

function novaReply(text){

  const t = text.toLowerCase();

  if(
    t.includes("hello") ||
    t.includes("hi") ||
    t.includes("hey") ||
    t.includes("helo")
  ){
    return "Hello! 👋 Main NOVA hoon. Tum kaisi ho?";
  }

  if(
    t.includes("tumhara naam") ||
    t.includes("your name") ||
    t.includes("naam kya")
  ){
    return "Mera naam NOVA AI hai. 🤖✨";
  }

  if(
    t.includes("kaise ho") ||
    t.includes("how are you")
  ){
    return "Main bilkul theek hoon! 😄 Tum batao, tum kaisi ho?";
  }

  if(
    t.includes("kya kar") ||
    t.includes("what are you doing")
  ){
    return "Abhi main tumse baat kar rahi hoon. 🤖💙";
  }

  if(
    t.includes("thank") ||
    t.includes("thanks")
  ){
    return "You're welcome! 😊 Jab bhi zarurat ho, NOVA yahin hai.";
  }

  if(
    t.includes("bye") ||
    t.includes("goodbye")
  ){
    return "Bye! 👋 Phir milte hain. NOVA online rahegi. 🤖";
  }

  if(
    t.includes("motivat") ||
    t.includes("motivation")
  ){
    return "✨ Yaad rakho: slow progress bhi progress hoti hai. Give up mat karo!";
  }

  if(
    t.includes("help") ||
    t.includes("madad")
  ){
    return "Bilkul! 😊 Apna question mujhe batao, main help karne ki koshish karungi.";
  }

  return "Hmm 🤔 Ye interesting hai! Thoda aur detail mein batao, main NOVA tumhari help karti hoon. 🤖✨";

}

</script>

</body>
</html>
